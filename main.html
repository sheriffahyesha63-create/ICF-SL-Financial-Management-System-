<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICF-SL · Financial Management System</title>
    <style>
        /* ----- reset & base (plain white body) ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            /* plain white body */
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #1e1e2a;
        }

        /* ----- NAVY HEADER (theme) ----- */
        .header {
            background-color: #1a2a4a;
            /* navy blue */
            color: #ffffff;
            padding: 1.5rem 2rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
        }

        .header-title-group {
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
        }

        .header-title-group h1 {
            font-weight: 500;
            font-size: 1.9rem;
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        .header-title-group h1 span {
            font-weight: 300;
            opacity: 0.9;
        }

        .header-sub {
            font-size: 1rem;
            font-weight: 300;
            opacity: 0.85;
            letter-spacing: 0.3px;
            margin-top: 0.1rem;
            border-left: 3px solid #5f7a9e;
            padding-left: 0.75rem;
        }

        .header-tagline {
            font-size: 0.95rem;
            opacity: 0.8;
            background: rgba(255, 255, 255, 0.07);
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            font-weight: 300;
            letter-spacing: 0.2px;
            white-space: nowrap;
        }

        /* ----- MAIN CONTENT (plain white) – only two cards ----- */
        .main-content {
            flex: 1;
            max-width: 1200px;
            margin: 2rem auto;
            padding: 1.5rem 2rem;
            width: 100%;
            background-color: #ffffff;
            /* plain white */
            color: #1e1e2a;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* ----- TWO CARDS (Data Entry & Financial Reports) – clickable, functional, linked ----- */
        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2.5rem;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            padding: 1rem 0;
        }

        .feature-card {
            background: #ffffff;
            border: 1px solid #e2e9f2;
            border-radius: 28px;
            padding: 2.8rem 2rem 2.5rem;
            box-shadow: 0 8px 24px rgba(26, 42, 74, 0.06);
            transition: 0.25s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }

        .feature-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 18px 40px rgba(26, 42, 74, 0.13);
            border-color: #a0b4cc;
        }

        .feature-card:active {
            transform: scale(0.97);
        }

        .feature-card .card-icon {
            font-size: 3.6rem;
            line-height: 1;
            margin-bottom: 0.8rem;
        }

        .feature-card h2 {
            font-weight: 500;
            font-size: 1.8rem;
            color: #142334;
            letter-spacing: -0.2px;
            margin-bottom: 0;
        }

        /* ----- active state (when card is "clicked") ----- */
        .feature-card.active-card {
            border-color: #1a2a4a;
            background: #f5f9ff;
            box-shadow: 0 8px 28px rgba(26, 42, 74, 0.15);
        }

        /* ----- NAVY FOOTER – only ICF-SL©2026 . FinanceManager ----- */
        .footer {
            background-color: #1a2a4a;
            /* navy blue */
            color: #ffffff;
            padding: 1.5rem 2rem;
            margin-top: auto;
            border-top: 1px solid #2c3e60;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            text-align: center;
        }

        .footer-copy {
            opacity: 0.95;
            font-weight: 350;
            letter-spacing: 0.3px;
            background: rgba(255, 255, 255, 0.04);
            padding: 0.3rem 1.6rem;
            border-radius: 40px;
        }

        .footer-copy strong {
            font-weight: 450;
            opacity: 1;
        }

        /* responsive */
        @media (max-width: 700px) {
            .header-content {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
            }
            .header-tagline {
                white-space: normal;
                font-size: 0.9rem;
                padding: 0.2rem 0.9rem;
            }
            .header-title-group h1 {
                font-size: 1.5rem;
            }
            .main-content {
                padding: 1rem 1.2rem;
                margin: 1rem auto;
            }
            .cards-container {
                grid-template-columns: 1fr;
                gap: 1.8rem;
                max-width: 500px;
            }
            .feature-card {
                padding: 2rem 1.5rem;
            }
            .feature-card h2 {
                font-size: 1.5rem;
            }
            .footer-content {
                flex-direction: column;
                gap: 0.5rem;
            }
        }

        @media (max-width: 450px) {
            .header-title-group h1 {
                font-size: 1.2rem;
            }
            .header-sub {
                font-size: 0.9rem;
                padding-left: 0.5rem;
            }
            .feature-card .card-icon {
                font-size: 2.8rem;
            }
            .feature-card h2 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

    <!-- ====== NAVY HEADER ====== -->
    <header class="header">
        <div class="header-content">
            <div class="header-title-group">
                <h1>INFORMATICS CONSULTANCY FIRM SIERRA LEONE</h1>
                <div class="header-sub">Financial Management System</div>
            </div>
            <div class="header-tagline">
                ⚡ ICF-SL · smart finance
            </div>
        </div>
    </header>

    <!-- ====== MAIN – PLAIN WHITE BODY with two linked, functional cards ====== -->
    <main class="main-content">

        <div class="cards-container">

            <!-- Card 1: Data Entry – links to dataentry.html -->
            <a href="dataentry.html" class="feature-card" data-card="data-entry">
                <div class="card-icon">📝</div>
                <h2>Data Entry</h2>
            </a>

            <!-- Card 2: Financial Reports – links to fin.html -->
            <a href="fin.html" class="feature-card" data-card="financial-reports">
                <div class="card-icon">📊</div>
                <h2>Financial Reports</h2>
            </a>

        </div>

        <!-- subtle feedback area (optional) -->
        <div id="feedback" style="text-align:center; margin-top:2rem; font-size:0.95rem; color:#4a5f7a; min-height:2rem; transition:0.2s;">
            &nbsp;
        </div>

    </main>

    <!-- ====== NAVY FOOTER – only ICF-SL©2026 . FinanceManager ====== -->
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-copy">
                <strong>ICF-SL©2026</strong> . FinanceManager
            </div>
        </div>
    </footer>

    <!-- ====== JAVASCRIPT – makes cards functional with visual feedback ====== -->
    <script>
        // Handle card click – shows feedback and toggles active state
        document.querySelectorAll('.feature-card').forEach(card => {
            card.addEventListener('click', function(e) {
                // Remove active state from all cards
                document.querySelectorAll('.feature-card').forEach(c => {
                    c.classList.remove('active-card');
                });

                // Add active state to the clicked card
                this.classList.add('active-card');

                // Get card name from h2 text
                const cardName = this.querySelector('h2')?.textContent || 'Card';

                // Show feedback
                const feedback = document.getElementById('feedback');
                if (feedback) {
                    feedback.innerHTML = `🔗 Navigating to <strong>${cardName}</strong>...`;
                    feedback.style.color = '#1a2a4a';
                    feedback.style.fontWeight = '400';
                }

                // The actual navigation happens via the href attribute
                // This allows the link to work normally
            });
        });

        // On page load, show a default message
        document.addEventListener('DOMContentLoaded', function() {
            const feedback = document.getElementById('feedback');
            if (feedback) {
                feedback.innerHTML = '💡 Click a card to navigate';
                feedback.style.color = '#7a8aa0';
            }
        });
    </script>

</body>
</html>
