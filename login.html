<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICF-SL · Login</title>
    <style>
        /* ----- reset & base (plain white body) ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #1e1e2a;
        }

        /* ----- NAVY HEADER (theme) ----- */
        .header {
            background-color: #1a2a4a;
            color: #ffffff;
            padding: 1.5rem 2rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
        }

        .header-title-group {
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
        }

        .header-title-group h1 {
            font-weight: 500;
            font-size: 1.9rem;
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        .header-title-group h1 span {
            font-weight: 300;
            opacity: 0.9;
        }

        .header-sub {
            font-size: 1rem;
            font-weight: 300;
            opacity: 0.85;
            letter-spacing: 0.3px;
            margin-top: 0.1rem;
            border-left: 3px solid #5f7a9e;
            padding-left: 0.75rem;
        }

        .header-tagline {
            font-size: 0.95rem;
            opacity: 0.8;
            background: rgba(255, 255, 255, 0.07);
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            font-weight: 300;
            letter-spacing: 0.2px;
            white-space: nowrap;
        }

        /* ----- MAIN CONTENT (plain white) ----- */
        .main-content {
            flex: 1;
            max-width: 1200px;
            margin: 2rem auto;
            padding: 1.5rem 2rem;
            width: 100%;
            background-color: #ffffff;
            color: #1e1e2a;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* ----- LOGIN CARD ----- */
        .login-container {
            max-width: 420px;
            width: 100%;
            margin: 0 auto;
            background: #fafcff;
            border: 1px solid #eef2f7;
            border-radius: 28px;
            padding: 2.8rem 2.5rem 2.5rem;
            box-shadow: 0 8px 32px rgba(26, 42, 74, 0.08);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header .lock-icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 0.5rem;
        }

        .login-header h2 {
            font-weight: 500;
            font-size: 1.6rem;
            color: #142334;
            letter-spacing: -0.2px;
        }

        .login-header p {
            color: #4a5f7a;
            font-size: 0.95rem;
            margin-top: 0.2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            font-size: 0.9rem;
            color: #1a2a4a;
            margin-bottom: 0.4rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1.5px solid #dce3ec;
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            background: #ffffff;
            transition: 0.2s ease;
            color: #1e1e2a;
        }

        .form-group input:focus {
            outline: none;
            border-color: #1a2a4a;
            box-shadow: 0 0 0 4px rgba(26, 42, 74, 0.08);
        }

        .form-group input::placeholder {
            color: #9aabbe;
        }

        /* Password toggle */
        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 3rem;
        }

        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            color: #7a8aa0;
            padding: 0.2rem;
            transition: 0.2s;
        }

        .toggle-password:hover {
            color: #1a2a4a;
        }

        /* Login button */
        .btn-login {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 40px;
            font-size: 1.05rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s ease;
            font-family: inherit;
            background: #1a2a4a;
            color: #ffffff;
            margin-top: 0.5rem;
        }

        .btn-login:hover {
            background: #2a3e64;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(26, 42, 74, 0.2);
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        /* Error message */
        .error-message {
            background: #fde8e8;
            color: #c62828;
            padding: 0.7rem 1rem;
            border-radius: 10px;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            display: none;
            border-left: 4px solid #c62828;
        }

        .error-message.visible {
            display: block;
        }

        /* ----- NAVY FOOTER ----- */
        .footer {
            background-color: #1a2a4a;
            color: #ffffff;
            padding: 1.5rem 2rem;
            margin-top: auto;
            border-top: 1px solid #2c3e60;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            text-align: center;
        }

        .footer-copy {
            opacity: 0.95;
            font-weight: 350;
            letter-spacing: 0.3px;
            background: rgba(255, 255, 255, 0.04);
            padding: 0.3rem 1.6rem;
            border-radius: 40px;
        }

        .footer-copy strong {
            font-weight: 450;
            opacity: 1;
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 700px) {
            .header-content {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
            }
            .header-tagline {
                white-space: normal;
                font-size: 0.9rem;
                padding: 0.2rem 0.9rem;
            }
            .header-title-group h1 {
                font-size: 1.5rem;
            }
            .main-content {
                padding: 1rem 1.2rem;
                margin: 1rem auto;
            }
            .login-container {
                padding: 2rem 1.5rem;
            }
            .footer-content {
                flex-direction: column;
                gap: 0.5rem;
            }
        }

        @media (max-width: 450px) {
            .header-title-group h1 {
                font-size: 1.2rem;
            }
            .header-sub {
                font-size: 0.9rem;
                padding-left: 0.5rem;
            }
            .login-container {
                padding: 1.5rem 1rem;
            }
            .login-header h2 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

    <!-- ====== NAVY HEADER ====== -->
    <header class="header">
        <div class="header-content">
            <div class="header-title-group">
                <h1>INFORMATICS CONSULTANCY FIRM SIERRA LEONE</h1>
                <div class="header-sub">Financial Management System</div>
            </div>
            <div class="header-tagline">
                ⚡ ICF-SL · secure access
            </div>
        </div>
    </header>

    <!-- ====== MAIN CONTENT – LOGIN ====== -->
    <main class="main-content">

        <div class="login-container">
            <div class="login-header">
                <span class="lock-icon">🔐</span>
                <h2>Welcome Back</h2>
                <p>Please enter your credentials to continue</p>
            </div>

            <!-- Error message -->
            <div id="errorMessage" class="error-message">
                ❌ Invalid username or password. Please try again.
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">👤 Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password">🔒 Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                        <button type="button" class="toggle-password" onclick="togglePassword()" aria-label="Toggle password visibility">
                            👁️
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-login">Sign In</button>
            </form>
        </div>

    </main>

    <!-- ====== NAVY FOOTER ====== -->
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-copy">
                <strong>ICF-SL©2026</strong> . FinanceManager
            </div>
        </div>
    </footer>

    <!-- ====== JAVASCRIPT ====== -->
    <script>
        // Credentials (private - not displayed on page)
        const VALID_USERNAME = "Admin";
        const VALID_PASSWORD = "Admin123";

        // Handle login form submission
        function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');

            // Validate credentials
            if (username === VALID_USERNAME && password === VALID_PASSWORD) {
                // Successful login - redirect to index.html
                errorMessage.classList.remove('visible');
                
                // Store login session
                sessionStorage.setItem('isLoggedIn', 'true');
                sessionStorage.setItem('username', username);
                
                // Redirect to main page
                window.location.href = 'index.html';
            } else {
                // Show error message
                errorMessage.classList.add('visible');
                
                // Clear password field for security
                document.getElementById('password').value = '';
                
                // Focus on username field
                document.getElementById('username').focus();
                document.getElementById('username').select();
            }
        }

        // Toggle password visibility
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleBtn = document.querySelector('.toggle-password');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.textContent = '🙈';
            } else {
                passwordInput.type = 'password';
                toggleBtn.textContent = '👁️';
            }
        }

        // Clear error message when user starts typing
        document.addEventListener('DOMContentLoaded', function() {
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const errorMessage = document.getElementById('errorMessage');

            function clearError() {
                errorMessage.classList.remove('visible');
            }

            usernameInput.addEventListener('input', clearError);
            passwordInput.addEventListener('input', clearError);

            // If already logged in, redirect to index
            if (sessionStorage.getItem('isLoggedIn') === 'true') {
                window.location.href = 'index.html';
            }
        });
    </script>

</body>
</html>
