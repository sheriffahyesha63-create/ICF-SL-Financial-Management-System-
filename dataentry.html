<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICF-SL · Data Entry</title>
    <style>
        /* ----- reset & base (plain white body) ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            /* plain white body */
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #1e1e2a;
        }

        /* ----- NAVY HEADER (theme) ----- */
        .header {
            background-color: #1a2a4a;
            /* navy blue */
            color: #ffffff;
            padding: 1.5rem 2rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
        }

        .header-title-group {
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
        }

        .header-title-group h1 {
            font-weight: 500;
            font-size: 1.9rem;
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        .header-title-group h1 span {
            font-weight: 300;
            opacity: 0.9;
        }

        .header-sub {
            font-size: 1rem;
            font-weight: 300;
            opacity: 0.85;
            letter-spacing: 0.3px;
            margin-top: 0.1rem;
            border-left: 3px solid #5f7a9e;
            padding-left: 0.75rem;
        }

        .header-tagline {
            font-size: 0.95rem;
            opacity: 0.8;
            background: rgba(255, 255, 255, 0.07);
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            font-weight: 300;
            letter-spacing: 0.2px;
            white-space: nowrap;
        }

        /* Back button in header */
        .back-link {
            color: #d4deec;
            text-decoration: none;
            font-size: 0.9rem;
            padding: 0.3rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 40px;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.3);
            color: #ffffff;
        }

        /* ----- MAIN CONTENT (plain white) – only two cards ----- */
        .main-content {
            flex: 1;
            max-width: 1200px;
            margin: 2rem auto;
            padding: 1.5rem 2rem;
            width: 100%;
            background-color: #ffffff;
            /* plain white */
            color: #1e1e2a;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .page-title {
            text-align: center;
            font-weight: 400;
            font-size: 1.6rem;
            color: #142334;
            margin-bottom: 1.5rem;
            letter-spacing: -0.2px;
        }

        .page-title span {
            font-weight: 300;
            opacity: 0.7;
        }

        /* ----- TWO CARDS (Income & Expenses) – clickable, functional, linked ----- */
        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2.5rem;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            padding: 1rem 0;
        }

        .feature-card {
            background: #ffffff;
            border: 1px solid #e2e9f2;
            border-radius: 28px;
            padding: 2.8rem 2rem 2.5rem;
            box-shadow: 0 8px 24px rgba(26, 42, 74, 0.06);
            transition: 0.25s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }

        .feature-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 18px 40px rgba(26, 42, 74, 0.13);
            border-color: #a0b4cc;
        }

        .feature-card:active {
            transform: scale(0.97);
        }

        .feature-card .card-icon {
            font-size: 3.6rem;
            line-height: 1;
            margin-bottom: 0.8rem;
        }

        .feature-card h2 {
            font-weight: 500;
            font-size: 1.8rem;
            color: #142334;
            letter-spacing: -0.2px;
            margin-bottom: 0;
        }

        /* Income card - subtle green accent */
        .feature-card.income-card {
            border-left: 4px solid #2e7d32;
        }

        .feature-card.income-card:hover {
            border-color: #2e7d32;
        }

        /* Expenses card - subtle red accent */
        .feature-card.expenses-card {
            border-left: 4px solid #c62828;
        }

        .feature-card.expenses-card:hover {
            border-color: #c62828;
        }

        /* active state */
        .feature-card.active-card {
            border-color: #1a2a4a;
            background: #f5f9ff;
            box-shadow: 0 8px 28px rgba(26, 42, 74, 0.15);
        }

        /* ----- NAVY FOOTER – only ICF-SL©2026 . FinanceManager ----- */
        .footer {
            background-color: #1a2a4a;
            /* navy blue */
            color: #ffffff;
            padding: 1.5rem 2rem;
            margin-top: auto;
            border-top: 1px solid #2c3e60;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            text-align: center;
        }

        .footer-copy {
            opacity: 0.95;
            font-weight: 350;
            letter-spacing: 0.3px;
            background: rgba(255, 255, 255, 0.04);
            padding: 0.3rem 1.6rem;
            border-radius: 40px;
        }

        .footer-copy strong {
            font-weight: 450;
            opacity: 1;
        }

        /* responsive */
        @media (max-width: 700px) {
            .header-content {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
            }
            .header-tagline {
                white-space: normal;
                font-size: 0.9rem;
                padding: 0.2rem 0.9rem;
            }
            .header-title-group h1 {
                font-size: 1.5rem;
            }
            .main-content {
                padding: 1rem 1.2rem;
                margin: 1rem auto;
            }
            .cards-container {
                grid-template-columns: 1fr;
                gap: 1.8rem;
                max-width: 500px;
            }
            .feature-card {
                padding: 2rem 1.5rem;
            }
            .feature-card h2 {
                font-size: 1.5rem;
            }
            .footer-content {
                flex-direction: column;
                gap: 0.5rem;
            }
            .back-link {
                font-size: 0.8rem;
                padding: 0.2rem 0.8rem;
            }
        }

        @media (max-width: 450px) {
            .header-title-group h1 {
                font-size: 1.2rem;
            }
            .header-sub {
                font-size: 0.9rem;
                padding-left: 0.5rem;
            }
            .feature-card .card-icon {
                font-size: 2.8rem;
            }
            .feature-card h2 {
                font-size: 1.3rem;
            }
            .page-title {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

    <!-- ====== NAVY HEADER ====== -->
    <header class="header">
        <div class="header-content">
            <div class="header-title-group">
                <h1>INFORMATICS CONSULTANCY FIRM SIERRA LEONE</h1>
                <div class="header-sub">Data Entry</div>
            </div>
            <div class="header-tagline">
                <a href="index.html" class="back-link">← Back</a>
            </div>
        </div>
    </header>

    <!-- ====== MAIN – PLAIN WHITE BODY with two cards: Income & Expenses ====== -->
    <main class="main-content">

        <h2 class="page-title">📋 <span>Select</span> Entry Type</h2>

        <div class="cards-container">

            <!-- Card 1: Income – links to income.html -->
            <a href="income.html" class="feature-card income-card" data-card="income">
                <div class="card-icon">💰</div>
                <h2>Income</h2>
            </a>

            <!-- Card 2: Expenses – links to expen.html -->
            <a href="expen.html" class="feature-card expenses-card" data-card="expenses">
                <div class="card-icon">💳</div>
                <h2>Expenses</h2>
            </a>

        </div>

    </main>

    <!-- ====== NAVY FOOTER – only ICF-SL©2026 . FinanceManager ====== -->
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-copy">
                <strong>ICF-SL©2026</strong> . FinanceManager
            </div>
        </div>
    </footer>

    <!-- ====== JAVASCRIPT – adds active state on click ====== -->
    <script>
        document.querySelectorAll('.feature-card').forEach(card => {
            card.addEventListener('click', function(e) {
                // Remove active state from all cards
                document.querySelectorAll('.feature-card').forEach(c => {
                    c.classList.remove('active-card');
                });

                // Add active state to the clicked card
                this.classList.add('active-card');

                // Log for debugging
                const cardName = this.querySelector('h2')?.textContent || 'Card';
                console.log(`📌 Navigating to: ${cardName}`);
            });
        });
    </script>

</body>
</html>
